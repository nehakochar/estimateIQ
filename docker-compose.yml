services:
  # 1. Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: estimateiq_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estimateiq_network

  # 2. Redis (Message Broker + Result Backend for Celery)
  redis:
    image: redis:7-alpine
    container_name: estimateiq_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estimateiq_network

  # 3. Vector Database for AI/Embeddings
  qdrant:
    image: qdrant/qdrant:latest
    container_name: estimateiq_qdrant
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "${QDRANT_PORT_HTTP}:6333"
      - "${QDRANT_PORT_GRPC}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estimateiq_network

  # 4. Application Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estimateiq_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - estimateiq_network

  # 5. Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estimateiq_celery_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - estimateiq_network

  # 6. Application Frontend (Vite dev server — swap for nginx build in production)
  # frontend:
  #   image: node:20-alpine
  #   container_name: estimateiq_frontend
  #   restart: always
  #   working_dir: /app
  #   command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 7000"
  #   ports:
  #     - "${FRONTEND_PORT:-7000}:7000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   environment:
  #     - VITE_API_BASE_URL=http://localhost:8000
  #     - VITE_APP_NAME=EstimateIQ
  #     - VITE_APP_VERSION=1.0.0
  #     - VITE_ENVIRONMENT=development
  #     # Tell Vite HMR to advertise localhost so the browser WebSocket works
  #     - VITE_HMR_HOST=localhost
  #     - VITE_HMR_PORT=7000
  #   depends_on:
  #     - backend
  #   networks:
  #     - estimateiq_network

# Persistent volumes prevent data from wiping out when containers stop
volumes:
  postgres_data:
  qdrant_storage:
  redis_data:

networks:
  estimateiq_network:
    driver: bridge
